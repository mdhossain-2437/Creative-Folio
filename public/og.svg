<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 630"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-label="Delowar Hossain — Creative Developer & UI/UX Designer · MMXXVII"
>
  <!-- Ink-900 base + warm radial glow toward the peach accent. -->
  <defs>
    <radialGradient id="glow" cx="78%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#e3bfb4" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#0c0c0c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#efece9" stop-opacity="0" />
      <stop offset="40%" stop-color="#efece9" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#efece9" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0c0c0c" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Editorial frame -->
  <rect
    x="40"
    y="40"
    width="1120"
    height="550"
    fill="none"
    stroke="#efece9"
    stroke-opacity="0.12"
  />

  <!-- Eyebrow row -->
  <g font-family="'Inter', ui-sans-serif, system-ui, sans-serif" fill="#efece9">
    <text x="72" y="100" font-size="18" letter-spacing="6" fill-opacity="0.6">
      ◌ FOLIO · MMXXVII
    </text>
    <text
      x="1128"
      y="100"
      font-size="18"
      letter-spacing="6"
      text-anchor="end"
      fill-opacity="0.6"
    >
      JOYPURHAT · BANGLADESH
    </text>
  </g>

  <!-- Wordmark — italic Newsreader display face. -->
  <g
    font-family="'Newsreader', ui-serif, Georgia, serif"
    fill="#efece9"
  >
    <text
      x="72"
      y="360"
      font-size="172"
      font-style="italic"
      font-weight="400"
      letter-spacing="-4"
    >
      Delowar
    </text>
    <text
      x="72"
      y="500"
      font-size="172"
      font-style="italic"
      font-weight="400"
      letter-spacing="-4"
      fill-opacity="0.92"
    >
      Hossain.
    </text>
  </g>

  <!-- Strap line -->
  <line x1="72" y1="540" x2="1128" y2="540" stroke="url(#rule)" stroke-width="1" />

  <g font-family="'Inter', ui-sans-serif, system-ui, sans-serif" fill="#efece9">
    <text x="72" y="582" font-size="20" letter-spacing="5" fill-opacity="0.78">
      CREATIVE DEVELOPER · UI / UX DESIGNER
    </text>
    <text
      x="1128"
      y="582"
      font-size="20"
      letter-spacing="5"
      text-anchor="end"
      fill="#e3bfb4"
    >
      DELOWARHOSSAIN.DEV
    </text>
  </g>

  <!-- Peach diamond accent -->
  <g transform="translate(1078 130) rotate(45)">
    <rect x="-22" y="-22" width="44" height="44" fill="#e3bfb4" />
  </g>
</svg>
