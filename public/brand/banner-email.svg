<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="be-title be-desc">
  <title id="be-title">Delowar Hossain. &#8212; Creative Developer &#38; UI/UX Designer &#183; MMXXVII</title>
  <desc id="be-desc">Centered email header banner, 1200 by 360 pixels, that also reads cleanly downscaled to 600 pixels wide. Deep ink #070708 ground with a soft peach corner glow, a 6px peach top rule, and an inset hairline frame. A centered stacked lockup carries an uppercase peach eyebrow, the italic Newsreader wordmark "Delowar Hossain." with a peach trailing period flanked by short peach hairlines, an uppercase role strip over a faded hairline, and a monospace strap reading section MMXXVII. A 45-degree peach diamond marks the top-left quiet zone with an outline echo at lower-right.</desc>

  <defs>
    <!-- Soft peach radial glow bleeding from the top-right corner over deep ink. -->
    <radialGradient id="be-glow" cx="84%" cy="6%" r="70%">
      <stop offset="0%" stop-color="#e3bfb4" stop-opacity="0.20" />
      <stop offset="52%" stop-color="#070708" stop-opacity="0" />
    </radialGradient>
    <!-- A faint counter-glow at the lower-left for depth balance. -->
    <radialGradient id="be-glow2" cx="10%" cy="108%" r="58%">
      <stop offset="0%" stop-color="#e3bfb4" stop-opacity="0.08" />
      <stop offset="60%" stop-color="#070708" stop-opacity="0" />
    </radialGradient>
    <!-- Hairline rule that fades at both ends — the editorial divider. -->
    <linearGradient id="be-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#efece9" stop-opacity="0" />
      <stop offset="50%" stop-color="#efece9" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#efece9" stop-opacity="0" />
    </linearGradient>
    <!-- Peach hairlines used for the short flanking strokes beside the wordmark. -->
    <linearGradient id="be-ruleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e3bfb4" stop-opacity="0" />
      <stop offset="100%" stop-color="#e3bfb4" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="be-ruleR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e3bfb4" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#e3bfb4" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep ink ground + layered peach glow. -->
  <rect width="1200" height="360" fill="#070708" />
  <rect width="1200" height="360" fill="url(#be-glow2)" />
  <rect width="1200" height="360" fill="url(#be-glow)" />

  <!-- 6px peach top rule. -->
  <rect x="0" y="0" width="1200" height="6" fill="#e3bfb4" />

  <!-- Inset editorial hairline frame, 1px warmwhite at 12%. -->
  <rect x="28" y="28" width="1144" height="304" fill="none" stroke="#efece9" stroke-opacity="0.12" stroke-width="1" />

  <!-- Corner ticks on the frame for a precise, drafted feel. -->
  <g stroke="#e3bfb4" stroke-opacity="0.55" stroke-width="1" fill="none">
    <path d="M28 52 L28 28 L52 28" />
    <path d="M1172 308 L1172 332 L1148 332" />
  </g>

  <!-- Eyebrow row: studio strap, centered. -->
  <text x="600" y="78" font-family="'Inter', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="16" letter-spacing="7" text-anchor="middle" fill="#e3bfb4" fill-opacity="0.92">&#9671;&#160;&#160;THE COMPILED THOUGHT&#160;&#160;&#9671;</text>

  <!-- Flanking peach hairlines beside the wordmark, symmetric about x=600. -->
  <line x1="150" y1="170" x2="330" y2="170" stroke="url(#be-ruleL)" stroke-width="1" />
  <line x1="870" y1="170" x2="1050" y2="170" stroke="url(#be-ruleR)" stroke-width="1" />

  <!-- Wordmark — italic Newsreader display face, centered, peach trailing period. -->
  <text x="600" y="198" font-family="'Newsreader', 'Georgia', 'Times New Roman', serif" font-style="italic" font-weight="500" font-size="110" letter-spacing="-0.03em" text-anchor="middle" fill="#efece9">Delowar Hossain<tspan fill="#e3bfb4">.</tspan></text>

  <!-- Tagline strip over a faded hairline. -->
  <line x1="240" y1="248" x2="960" y2="248" stroke="url(#be-rule)" stroke-width="1" />
  <text x="600" y="284" font-family="'Inter', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="18" letter-spacing="6" text-anchor="middle" fill="#efece9" fill-opacity="0.78">CREATIVE DEVELOPER&#160;&#160;&#183;&#160;&#160;UI / UX DESIGNER</text>

  <!-- Footer strap: section + edition, centered, over the frame baseline. -->
  <text x="600" y="316" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="14" letter-spacing="5" text-anchor="middle" fill="#efece9" fill-opacity="0.55">&#167; MMXXVII&#160;&#160;<tspan fill="#e3bfb4">&#9671;</tspan>&#160;&#160;DELOWARHOSSAIN.DEV</text>

  <!-- Peach diamond accent: a square rotated 45 degrees, top-left quiet zone. -->
  <rect x="56" y="50" width="28" height="28" transform="rotate(45 70 64)" fill="#e3bfb4" />
  <!-- Echo diamond outline, lower-right, for compositional rhyme. -->
  <rect x="1116" y="282" width="28" height="28" transform="rotate(45 1130 296)" fill="none" stroke="#e3bfb4" stroke-opacity="0.55" stroke-width="1" />
</svg>
